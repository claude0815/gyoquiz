# Fragenkatalog GyO-VO & AP-V (Land Bremen)
#
# Regeln für Änderungen (siehe auch CLAUDE.md):
# - Eine id wird nie geändert und nie neu vergeben. Duell-Links speichern ids.
# - Neue Fragen bekommen die nächste freie Nummer (g… für GyO-VO, a… für AP-V).
# - Ändert sich bei einer bestehenden Frage die richtige Antwort, wird die alte Frage
#   unter "ausgemustert" verschoben und die neue Fassung bekommt eine neue id.
# - "richtig" ist die korrekte Antwort, "falsch" enthält genau drei Ablenker.
#   Die Reihenfolge der Antworten wird in der App gemischt.
# - "fall: true" markiert Fall- und Rechenfragen.
# - Jede Frage muss ohne den Abschnittsnamen verständlich sein.
# - Nach jeder inhaltlichen Änderung katalog.version erhöhen.

