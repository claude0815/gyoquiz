      - Der Schulträger
      - Die Gesamtkonferenz
      - Eine benachbarte öffentliche Schule
    erklaerung: An anerkannten Ersatzschulen bestellt die Senatorin den Vorsitz.
  - id: a006
    abschnitt: apv-allgemein
    fundstelle: § 2 Abs. 3
    frage: Wer bestellt die übrigen Mitglieder der Prüfungskommission?
    richtig: Der Vorsitz, aus dem Kollegium der Schule
    falsch:
      - Die Gesamtkonferenz durch Wahl
      - Die Senatorin
      - Die Fachkonferenzen
    erklaerung: Der Vorsitz beauftragt auch die Stellvertretung.
  - id: a007
    abschnitt: apv-allgemein
    fundstelle: § 2 Abs. 3
    frage: Kann eine Schule mit mehreren Bildungsgängen eine gemeinsame Prüfungskommission bilden?
    richtig: Ja, mit Genehmigung der Senatorin
    falsch:
      - Nein
      - Ja, ohne Genehmigung
      - Nur in Bremerhaven
    erklaerung: Die Genehmigung erteilt die Senatorin für Kinder und Bildung.
  - id: a008
    abschnitt: apv-allgemein
    fundstelle: § 2 Abs. 4
    frage: Wann ist die Prüfungskommission beschlussfähig?
    richtig: Wenn Vorsitz und zwei weitere Mitglieder anwesend sind
    falsch:
      - Nur wenn alle vier anwesend sind
      - Bei zwei beliebigen Mitgliedern
      - Bei Vorsitz und einem weiteren Mitglied
    erklaerung: Entscheidungen mit einfacher Mehrheit, keine Enthaltung, Protokollpflicht.
  - id: a009
    abschnitt: apv-allgemein
    fundstelle: § 2 Abs. 4
    frage: Was gilt bei Stimmengleichheit in der Prüfungskommission?
    richtig: Die Stimme des Vorsitzes entscheidet
    falsch:
      - Der Antrag ist abgelehnt
      - Es wird neu abgestimmt
      - Die Senatorin entscheidet
    erklaerung: Stimmenthaltungen sind nicht zulässig.
  - id: a010
    abschnitt: apv-allgemein
    fundstelle: § 2 Abs. 5
    frage: Wann MUSS der Vorsitz der Prüfungskommission einen Bewertungsbeschluss eines Fachprüfungsausschusses aussetzen?
    richtig: Wenn es zur Wahrung einheitlicher Bewertungsmaßstäbe erforderlich ist
    falsch:
      - Bei jeder Note unter 5 Punkten
      - Auf Antrag des Prüflings
      - Nie
    erklaerung: Allgemein kann er nach Anhörung aussetzen; bei Bewertungen muss er es zur Wahrung einheitlicher Maßstäbe.
  - id: a011
    abschnitt: apv-allgemein
    fundstelle: § 2 Abs. 6
    frage: Welche Rechte haben Mitglieder der Prüfungskommission bei den Prüfungen?
    richtig: Teilnahme an allen Prüfungen und Beratungen ohne Stimmrecht, Einsicht in schriftliche Arbeiten
    falsch:
      - Stimmrecht in allen Ausschüssen
      - Nur Teilnahme in ihrem Fach
      - Keine
    erklaerung: Teilnahme ohne Stimmrecht und Einsicht in die schriftlichen Arbeiten.
  - id: a012
    abschnitt: apv-allgemein
    fundstelle: § 3 Abs. 1
    frage: Wie ist der Fachprüfungsausschuss für schriftliche Prüfungen besetzt?
    richtig: Vorsitz, Referentin/Referent, Korreferentin/Korreferent
    falsch:
      - Vorsitz, Prüferin/Prüfer, Protokollantin/Protokollant
      - Zwei Fachlehrkräfte und Schulleitung
      - Die gesamte Prüfungskommission
    erklaerung: Für jede Prüfung eines Prüflings wird ein eigener Ausschuss bestellt.
  - id: a013
    abschnitt: apv-allgemein
    fundstelle: § 3 Abs. 1
    frage: Wie ist der Fachprüfungsausschuss für mündliche Prüfungen besetzt?
    richtig: Vorsitz, Prüferin/Prüfer, Protokollantin/Protokollant
    falsch:
      - Vorsitz, Referent, Korreferent
      - Prüfer allein mit Zuhörern
      - Zwei Prüfer und Schulleitung
    erklaerung: Gleiches gilt für mündliche Teile der besonderen Fachprüfung und die besondere Lernleistung.
  - id: a014
    abschnitt: apv-allgemein
    fundstelle: § 3 Abs. 1
    frage: Welche fachliche Voraussetzung sollen Ausschussmitglieder im 1. bis 4. Prüfungsfach erfüllen?
    richtig: Lehramtsprüfung im Fach abgelegt oder das Fach unterrichtet
    falsch:
      - Promotion im Fach
      - Mitglied der Fachkonferenz einer anderen Schule
      - Keine
    erklaerung: Über Ausnahmen entscheidet der Vorsitz der Prüfungskommission.
  - id: a015
    abschnitt: apv-allgemein
    fundstelle: § 3 Abs. 2
    frage: Wer ist Prüferin oder Prüfer bei schriftlichen und mündlichen Prüfungen?
    richtig: Die Prüfungsfachlehrkraft im letzten Halbjahr der Qualifikationsphase
    falsch:
      - Eine Lehrkraft einer anderen Schule
      - Die Fachprüfungsleitung
      - Die Schulleitung
    erklaerung: Maßgeblich ist die Lehrkraft des letzten Q-Halbjahres.
  - id: a016
    abschnitt: apv-allgemein
    fundstelle: § 3 Abs. 2
    frage: Wer soll vorrangig den Vorsitz der Fachprüfungsausschüsse übernehmen?
    richtig: Lehrkräfte in besonderer Funktion mit Lehrbefähigung im Fach oder zumindest im Aufgabenfeld
    falsch:
      - Die jüngsten Lehrkräfte
      - Externe Fachberater
      - Klassenleitungen
    erklaerung: So regelt es § 3 Abs. 2 Satz 1.
  - id: a017
    abschnitt: apv-allgemein
    fundstelle: § 3 Abs. 3
    frage: Wann ist ein Fachprüfungsausschuss beschlussfähig?
    richtig: Wenn Vorsitz, Prüferin/Prüfer und ein weiteres Mitglied anwesend sind
    falsch:
      - Bei Vorsitz und Prüfer
      - Bei zwei beliebigen Mitgliedern
      - Nur mit Schulleitung
    erklaerung: Notfalls bestellt der Vorsitz der Prüfungskommission eine Stellvertretung.
  - id: a018
    abschnitt: apv-allgemein
    fundstelle: § 3 Abs. 4
    frage: Der Vorsitz eines Fachprüfungsausschusses hält einen Beschluss für fehlerhaft. Was tut er?
    richtig: Beschluss aussetzen und eine Entscheidung der Prüfungskommission herbeiführen
    falsch:
      - Note selbst ändern
      - Senatorin entscheiden lassen
      - Prüfung wiederholen lassen
    erklaerung: Die Prüfungskommission entscheidet dann.
  - id: a019
    abschnitt: apv-allgemein
    fundstelle: § 4 Abs. 1
    frage: Welche Schülerinnen und Schüler dürfen bei mündlichen und praktischen Abiturprüfungen zuhören?
    richtig: Schüler des ersten Schuljahrgangs der Qualifikationsphase
    falsch:
      - Alle Schüler der Schule
      - Nur die Schülervertretung
      - Der eigene Abiturjahrgang
    erklaerung: Zuhören dürfen Schülerinnen und Schüler des ersten Q-Jahrgangs.
  - id: a020
    abschnitt: apv-allgemein
    fundstelle: § 4 Abs. 1
    frage: Welche Elternvertretung darf bei mündlichen und praktischen Abiturprüfungen zuhören?
    richtig: Je ein Mitglied des Zentralelternbeirats und des Schulelternbeirats
    falsch:
      - Alle Eltern des Jahrgangs
      - Nur die Eltern des Prüflings
      - Keine
    erklaerung: Außerdem Lehrkräfte der Schule und bis zu zwei Personen mit dienstlichem Interesse.
  - id: a021
    abschnitt: apv-allgemein
    fundstelle: § 4 Abs. 1
    frage: Wie viele Personen, deren Anwesenheit im dienstlichen Interesse liegt, dürfen bei mündlichen und praktischen Abiturprüfungen zusätzlich zuhören?
    richtig: Bis zu zwei
    falsch:
      - Eine
      - Bis zu fünf
      - Unbegrenzt
    erklaerung: Bis zu zwei Personen, deren Anwesenheit im dienstlichen Interesse liegt.
  - id: a022
    abschnitt: apv-allgemein
    fundstelle: § 4 Abs. 2
    frage: Welche Zuhörerinnen und Zuhörer einer mündlichen Abiturprüfung dürfen auch bei der anschließenden Beratung des Fachprüfungsausschusses anwesend sein?
    richtig: Lehrkräfte und Personen mit dienstlichem Interesse
    falsch:
      - Alle Zuhörer
      - Elternvertreter
      - Niemand außer dem Ausschuss
    erklaerung: Eltern- und Schülerzuhörer sind bei der Beratung nicht dabei.
  - id: a023
    abschnitt: apv-allgemein
    fundstelle: § 4 Abs. 3
    frage: Welche Gruppe von Zuhörern kann ein Prüfling von seiner mündlichen oder praktischen Abiturprüfung ausschließen?
    richtig: Schülerinnen und Schüler
    falsch:
      - Lehrkräfte
      - Personen mit dienstlichem Interesse
      - Niemanden
    erklaerung: Der Prüfling kann die Zuhörerschaft von Schülern ausschließen.
  - id: a024
    abschnitt: apv-allgemein
    fundstelle: § 5 Abs. 1
    frage: Welche Folge hat ein Täuschungsversuch in der Abiturprüfung im Regelfall?
    richtig: Die Abiturprüfung wird für nicht bestanden erklärt
    falsch:
      - Die Einzelprüfung wird wiederholt
      - 3 Punkte Abzug
      - Schriftlicher Verweis
    erklaerung: In leichteren Fällen wird nur die betroffene Leistung mit „ungenügend“ bewertet.
  - id: a025
    abschnitt: apv-allgemein
    fundstelle: § 5 Abs. 1
    frage: Welche Folge hat ein Täuschungsversuch in der Abiturprüfung in leichteren Fällen?
    richtig: Die betroffene Leistung wird mit „ungenügend“ bewertet
    falsch:
      - Abitur nicht bestanden
      - Keine Folgen
      - Notenabsenkung um eine Stufe
    erklaerung: So § 5 Abs. 1 Satz 2.
  - id: a026
    abschnitt: apv-allgemein
    fundstelle: § 5 Abs. 1
    frage: Ein Prüfling hat in der Abiturprüfung zu täuschen versucht. Darf er bis zur Entscheidung weiter an der Prüfung teilnehmen?
    richtig: Ja, bis zur Entscheidung der Prüfungskommission
    falsch:
      - Nein, er wird sofort ausgeschlossen
      - Nur mit Zustimmung der Erziehungsberechtigten
      - Nur an den mündlichen Prüfungen
    erklaerung: Bis zur Entscheidung darf er weiter teilnehmen.
  - id: a027
    abschnitt: apv-allgemein
    fundstelle: § 5 Abs. 2
    frage: Wer entscheidet endgültig über den Ausschluss eines Prüflings, der eine Prüfung schwerwiegend behindert?
    richtig: Die Prüfungskommission, die die Prüfung dann für nicht bestanden erklärt
    falsch:
      - Die Aufsicht
      - Die Senatorin
      - Der Fachprüfungsausschuss
    erklaerung: Vorläufig kann ausgeschlossen werden; endgültig entscheidet die Kommission.
  - id: a028
    abschnitt: apv-allgemein
    fundstelle: § 5 Abs. 3
    frage: Was muss vor einer Entscheidung über Täuschung oder Behinderung geschehen?
    richtig: Anhörung des Prüflings durch die Prüfungskommission
    falsch:
      - Zustimmung der Eltern
      - Information der Polizei
      - Zustimmung der Senatorin
    erklaerung: Die Prüfungskommission muss den Prüfling anhören.
  - id: a029
    abschnitt: apv-allgemein
    fundstelle: § 6 Abs. 1
    frage: Was muss vorlegen, wer wegen Erkrankung einen Teil der Abiturprüfung versäumt?
    richtig: Unverzüglich eine ärztliche Bescheinigung
    falsch:
      - Binnen vier Wochen eine Elternerklärung
      - Nichts
      - Ein amtsärztliches Gutachten binnen eines Monats
    erklaerung: Bei anderen wichtigen Gründen ist nachzuweisen, dass man das Versäumnis nicht zu vertreten hat.
  - id: a030
    abschnitt: apv-allgemein
    fundstelle: § 6 Abs. 2
    frage: Ein Prüfling versäumt aus selbst zu vertretenden Gründen einen Termin der Abiturprüfung. Welche Folge hat das?
    richtig: Die nicht erbrachte Leistung wird „ungenügend“; in leichteren Fällen wird der Teil wiederholt
    falsch:
      - Automatischer Nachtermin
      - Abitur nicht bestanden
      - 5 Punkte
    erklaerung: So § 6 Abs. 2 Satz 1 und 2.
  - id: a031
    abschnitt: apv-allgemein
    fundstelle: § 6 Abs. 2
    frage: Was gilt, wenn ein Prüfling aus selbst zu vertretenden Gründen mehr als einen Teil der Abiturprüfung versäumt?
    richtig: Die Abiturprüfung wird für nicht bestanden erklärt
    falsch:
      - Beide Teile werden nachgeholt
      - Nur der zweite Teil wird „ungenügend“
      - Verschiebung aufs nächste Jahr
    erklaerung: So § 6 Abs. 2 Satz 3.
  - id: a032
    abschnitt: apv-allgemein
    fundstelle: § 6 Abs. 3
    frage: Ein Prüfling versäumt krankheitsbedingt eine schriftliche Abiturprüfung mit zentral gestellten Aufgaben. Wer legt den zweiten Prüfungstermin fest?
    richtig: Die Senatorin für Kinder und Bildung
    falsch:
      - Die Prüfungskommission
      - Die Fachlehrkraft
      - Der Prüfling mit der Schule
    erklaerung: Bei zentral gestellten Aufgaben bestimmt die Senatorin den zweiten Termin.
  - id: a033
    abschnitt: apv-allgemein
    fundstelle: § 6 Abs. 3
    frage: Ein Prüfling versäumt unverschuldet eine schriftliche Abiturprüfung in einem Fach mit dezentral gestellten Aufgaben. Wer setzt den neuen Termin fest?
    richtig: Die Prüfungskommission
    falsch:
      - Die Senatorin
      - Die Fachprüfungsleitung
      - Die Prüferin allein
    erklaerung: Ebenso, wenn der zweite zentrale Termin unverschuldet erneut versäumt wird.
  - id: a034
    abschnitt: apv-allgemein
    fundstelle: § 6 Abs. 3
    frage: Welche Aufgabe kann beim Nachtermin einer schriftlichen Abiturprüfung in einem dezentral geprüften Fach gestellt werden?
    richtig: Ein nicht gewählter Aufgabenvorschlag, wenn ihn die Fachaufsicht genehmigt hat
    falsch:
      - Dieselbe Aufgabe wie im Haupttermin
      - Eine beliebige neue Aufgabe ohne Genehmigung
      - Eine Zentralaufgabe aus dem Vorjahr
    erklaerung: In zentral geprüften Fächern wird ein angeforderter, von der Fachaufsicht gewählter Vorschlag gestellt.
  - id: a035
    abschnitt: apv-allgemein
    fundstelle: § 6a
    frage: Was kommt als Nachteilsausgleich für Prüflinge mit Behinderungen insbesondere in Betracht?
    richtig: Spezielle Hilfsmittel, angemessene Zeitverlängerung oder Pausen
    falsch:
      - Geringere fachliche Anforderungen
      - Erlass eines Prüfungsfachs
      - Bessere Bewertung
    erklaerung: Die Nachteile werden durch organisatorische Maßnahmen ausgeglichen.
  - id: a036
    abschnitt: apv-allgemein
    fundstelle: § 6a
    frage: Was bleibt beim Nachteilsausgleich unberührt?
    richtig: Die fachlichen Anforderungen
    falsch:
      - Die Arbeitszeit
      - Die Prüfungsorganisation
      - Die Hilfsmittel
    erklaerung: Organisation darf sich ändern, die fachlichen Anforderungen nicht.
  - id: a037
    abschnitt: apv-allgemein
    fundstelle: § 6a
    frage: Wer entscheidet über Abweichungen von Verfahrensvorschriften beim Nachteilsausgleich?
    richtig: Die Prüfungskommission
    falsch:
      - Die Senatorin
      - Die Prüferin
      - Ein ärztlicher Gutachter
    erklaerung: So § 6a Satz 3.
  - id: a038
    abschnitt: apv-zulassung
    fundstelle: § 7 Abs. 1
    frage: Was gibt man bei der schriftlichen Meldung zur Abiturprüfung an?
    richtig: Das 3. und 4. Prüfungsfach, bei drei Leistungsfächern auch das 1. und 2. Leistungsfach
    falsch:
      - Alle vier Fächer und Wunschnoten
      - Nur das 4. Prüfungsfach
      - Die einzubringenden Grundkurse
    erklaerung: So § 7 Abs. 1 Nr. 1 und 2.
  - id: a039
    abschnitt: apv-zulassung
    fundstelle: § 7 Abs. 1
    frage: Wer legt die Termine für die Meldung zur Abiturprüfung fest?
    richtig: Die Senatorin für Kinder und Bildung
    falsch:
      - Die Schulleitung
      - Die Prüfungskommission
      - Die Fachkonferenzen
    erklaerung: So § 7 Abs. 1 letzter Satz.
  - id: a040
    abschnitt: apv-zulassung
    fundstelle: § 7 Abs. 1
    frage: Bis wann kann die Meldung einer besonderen Lernleistung zurückgezogen werden?
    richtig: Bis eine Woche vor dem Kolloquium
    falsch:
      - Bis zur ersten Prüfungskonferenz
      - Bis zum Kolloquiumstag
      - Gar nicht
    erklaerung: Eine Woche vor dem angesetzten Kolloquium.
  - id: a041
    abschnitt: apv-zulassung
    fundstelle: § 7 Abs. 1
    frage: Die Bedingungen für die besondere Lernleistung sind eine Woche vor der ersten Prüfungskonferenz nicht erfüllt. Folge?
    richtig: Die Einbringung einer besonderen Lernleistung entfällt
    falsch:
      - Die Frist verlängert sich
      - Sie wird mit 0 Punkten eingebracht
      - Abitur nicht bestanden
    erklaerung: So § 7 Abs. 1 Satz 3.
  - id: a042
    abschnitt: apv-zulassung
    fundstelle: § 7 Abs. 2
    frage: Worüber entscheidet die Prüfungskommission in der ersten Prüfungskonferenz?
    richtig: Über die Leistungen der Q-Phase und die Zulassung
    falsch:
      - Über zusätzliche mündliche Prüfungen
      - Über das Bestehen
      - Über die Aufgaben
    erklaerung: Zugelassen wird, wer Belegungsauflagen und § 8 erfüllt und sich fristgerecht gemeldet hat.
  - id: a043
    abschnitt: apv-zulassung
    fundstelle: § 7 Abs. 3
    frage: Eine Zulassungsbedingung fehlt, mangelhafte Einzelleistungen gibt es nicht. Wird der Schüler zugelassen?
    richtig: Nein
    falsch:
      - Ja, ohne mangelhafte Leistungen immer
      - Ja, mit Auflagen
      - Die Senatorin entscheidet
    erklaerung: Wer eine Bedingung nicht erfüllt, wird auch ohne mangelhafte Einzelleistungen nicht zugelassen.
  - id: a044
    abschnitt: apv-zulassung
    fundstelle: § 7 Abs. 4
    frage: Wie werden die Ergebnisse der ersten Prüfungskonferenz mitgeteilt?
    richtig: Schriftlich, mit Informationen u. a. zu Zuhörern, Täuschung und Versäumnis
    falsch:
      - Nur mündlich
      - Per Aushang
      - Nur auf Nachfrage
    erklaerung: Informiert wird über §§ 4, 5, 6, § 11 Abs. 2 und 3, § 14 Abs. 1 bis 3 und § 17 Abs. 3 bis 5.
  - id: a045
    abschnitt: apv-zulassung
    fundstelle: § 7 Abs. 5
    frage: Ist ein Rücktritt von der Abiturprüfung möglich?
    richtig: Ja, vor Prüfungsbeginn im Einvernehmen mit der Schule
    falsch:
      - Ja, jederzeit
      - Nein
      - Nur mit Attest
    erklaerung: So § 7 Abs. 5.
  - id: a046
    abschnitt: apv-zulassung
    fundstelle: § 7 Abs. 6
    frage: Was gilt bei Nichtzulassung zur Abiturprüfung?
    richtig: Teilnahme ohne Bewertung am Unterricht des zweiten Q-Schulhalbjahres, wenn die Höchstverweildauer es erlaubt
    falsch:
      - Sofortiges Verlassen der Schule
      - Wiederholung der ganzen Q-Phase
      - Herbst-Nachprüfung
    erklaerung: Danach kann das Abitur innerhalb der Höchstverweildauer abgelegt werden.
  - id: a047
    abschnitt: apv-zulassung
    fundstelle: § 8 Abs. 1 Nr. 1a
    frage: Wie viele Grundkurse werden in der Gymnasialen Oberstufe für die Zulassung eingebracht?
    richtig: "24"
    falsch:
      - "22"
      - "14"
      - "20"
    erklaerung: 24 Grundkurse in einfacher Wertung, darunter die Kurse im 3. und 4. Prüfungsfach.
  - id: a048
    abschnitt: apv-zulassung
    fundstelle: § 8 Abs. 1 Nr. 1b
    frage: Wie viele Leistungskurse werden in der Gymnasialen Oberstufe für die Zulassung zur Abiturprüfung eingebracht?
    richtig: Acht
    falsch:
      - Sechs
      - Zwölf
      - Vier
    erklaerung: Acht Leistungskurse aus der Qualifikationsphase.
  - id: a049
    abschnitt: apv-zulassung
    fundstelle: § 8 Abs. 1 Nr. 1b
    frage: "Einbringung für die Zulassung: Welche Leistungskurse werden zweifach gewertet?"
    richtig: Die der ersten drei Halbjahre der Qualifikationsphase
    falsch:
      - Alle acht
      - Nur die des letzten Halbjahres
      - Nur das erste Leistungsfach
    erklaerung: Die Leistungskurse des vierten Q-Halbjahres zählen einfach.
  - id: a050
    abschnitt: apv-zulassung
    fundstelle: § 8 Abs. 1 Nr. 1c
    frage: Wie wird die Projektarbeit für die Zulassung gewertet?
    richtig: Zweifach
    falsch:
      - Einfach
      - Gar nicht
      - Vierfach
    erklaerung: Die Projektarbeit geht in zweifacher Wertung ein.
  - id: a051
    abschnitt: apv-zulassung
    fundstelle: § 8 Abs. 1 Nr. 1
    frage: "Zulassung in der Gymnasialen Oberstufe: Wie viele der eingebrachten Kurse dürfen höchstens unter 5 Punkten (einfache Wertung) liegen?"
    richtig: Sechs, davon höchstens zwei Leistungskurse
    falsch:
      - Acht, davon höchstens vier LK
      - Vier, davon höchstens ein LK
      - Sechs, LK beliebig
    erklaerung: Gilt für Gymnasiale Oberstufe, Berufliches Gymnasium, doppelqualifizierende Bildungsgänge und Kolleg.
  - id: a052
    abschnitt: apv-zulassung
    fundstelle: § 8 Abs. 1 Nr. 4
    frage: Wie berechnet sich das Gesamtergebnis der Qualifikationsphase (Block I)?
    richtig: Summe aller Kurshalbjahresergebnisse geteilt durch ihre Anzahl, mal 40
    falsch:
      - Summe mal 2
      - LK-Durchschnitt mal 40
      - Grundkurse plus doppelte LK
    erklaerung: Doppelt gewichtete Kurse zählen bei der Anzahl doppelt; die Projektarbeit gilt als Kurshalbjahresergebnis.
  - id: a053
    abschnitt: apv-zulassung
    fundstelle: § 8 Abs. 1 Nr. 4
    fall: true
    frage: "Gesamtergebnis der Qualifikationsphase in der Gymnasialen Oberstufe: Eingebracht werden 24 Grundkurse einfach, sechs Leistungskurse doppelt, zwei Leistungskurse einfach und die Projektarbeit doppelt. Welche Anzahl der Kurshalbjahresergebnisse steht im Nenner der Formel nach § 8 Abs. 1 Nr. 4?"
    richtig: "40"
    falsch:
      - "34"
      - "32"
      - "38"
