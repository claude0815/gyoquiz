glossar:
  - begriff: E-Phase
    erklaerung: Einführungsphase, das erste Jahr der Gymnasialen Oberstufe (§ 2 GyO-VO).
  - begriff: Q-Phase
    erklaerung: Qualifikationsphase, die zwei Jahre vor dem Abitur mit vier Halbjahren (§ 2 GyO-VO).
  - begriff: LK / GK
    erklaerung: Leistungskurs (erhöhtes Anforderungsniveau, fünfstündig) und Grundkurs (grundlegendes Anforderungsniveau).
  - begriff: Kernfächer
    erklaerung: Deutsch, Mathematik und erste Fremdsprache; maßgeblich für die Versetzung nach § 16 GyO-VO.
  - begriff: Jahreswochenstunden
    erklaerung: Wochenstunden eines Faches, gerechnet über ein ganzes Schuljahr.
  - begriff: Aufgabenfeld I, II, III
    erklaerung: I sprachlich-literarisch-künstlerisch, II gesellschaftswissenschaftlich, III mathematisch-naturwissenschaftlich-technisch (§ 7 Abs. 4 und Anlage 1 GyO-VO).
  - begriff: Prüfungsfach (1. bis 4.)
    erklaerung: 1. und 2. Prüfungsfach sind die Leistungskurse (schriftlich), das 3. ist ein Grundkurs (schriftlich), das 4. ein Grundkurs (mündlich), § 9 AP-V.
  - begriff: Block I
    erklaerung: Gängige Bezeichnung für das Gesamtergebnis der Qualifikationsphase nach § 8 AP-V, höchstens 600, mindestens 200 Punkte.
  - begriff: Block II
    erklaerung: Gängige Bezeichnung für das Ergebnis der Abiturprüfungen nach § 18 AP-V, höchstens 300, mindestens 100 Punkte.
  - begriff: Fachprüfungsausschuss
    erklaerung: "Wird für jede einzelne Prüfung eines Prüflings bestellt: schriftlich Vorsitz, Referent und Korreferent; mündlich Vorsitz, Prüfer und Protokollant (§ 3 AP-V)."
  - begriff: Referent / Korreferent
    erklaerung: Erst- und Zweitkorrektur einer schriftlichen Abiturarbeit (§ 12 AP-V).
  - begriff: Besondere Fachprüfung
    erklaerung: Prüfung mit schriftlichem oder mündlichem und praktischem Teil, je zur Hälfte gewichtet, etwa in Sport oder Musik (§ 15 AP-V).
  - begriff: Besondere Lernleistung
    erklaerung: Eingebrachter Beitrag aus einem genehmigten Wettbewerb mit Dokumentation, Reflexion und Kolloquium; dann zählen alle Prüfungen vierfach (§§ 16, 18 AP-V).
  - begriff: Prüfungskonferenzen
    erklaerung: "Erste: Zulassung. Zweite: Ergebnisse der Prüfungen, zusätzliche mündliche Prüfungen. Dritte: Gesamtergebnis und Bestehen (§§ 7, 17, 18 AP-V)."
  - begriff: Senatorin
    erklaerung: Die Senatorin für Kinder und Bildung, oberste Schulbehörde im Land Bremen.
fragen:
  - id: g001
    abschnitt: gyo-allgemein
    fundstelle: § 1
    frage: Für welchen Bereich gilt die Verordnung über die Gymnasiale Oberstufe?
    richtig: Für die Gymnasiale Oberstufe
    falsch:
      - Für die gesamte Sekundarstufe I und II des Gymnasiums
      - Für alle zur Hochschulreife führenden Bildungsgänge einschließlich Beruflicher Gymnasien
      - Nur für die Qualifikationsphase
    erklaerung: "§ 1 besteht aus einem Satz: Die Verordnung gilt für die Gymnasiale Oberstufe."
  - id: g002
    abschnitt: gyo-allgemein
    fundstelle: § 2 Abs. 1
    frage: Wie ist die Gymnasiale Oberstufe zeitlich gegliedert?
    richtig: Einjährige Einführungsphase, danach zweijährige Qualifikationsphase
    falsch:
      - Zweijährige Einführungsphase, danach einjährige Qualifikationsphase
      - Dreijährige Qualifikationsphase ohne Einführungsphase
      - Halbjährige Einführungsphase, danach zweieinhalbjährige Qualifikationsphase
    erklaerung: Die Oberstufe besteht aus einer einjährigen Einführungsphase und einer anschließenden zweijährigen Qualifikationsphase.
  - id: g003
    abschnitt: gyo-allgemein
    fundstelle: § 2 Abs. 1
    frage: Welcher Schulstufe ist die Gymnasiale Oberstufe zugeordnet?
    richtig: Der Sekundarstufe II
    falsch:
      - Der Sekundarstufe I
      - Dem Tertiärbereich
      - Keiner Stufe, sie ist ein eigener Bildungsbereich
    erklaerung: Die Gymnasiale Oberstufe ist der Sekundarstufe II zugeordnet.
  - id: g004
    abschnitt: gyo-allgemein
    fundstelle: § 2 Abs. 2
    frage: Welche Aufgabe hat die Einführungsphase?
    richtig: Sie bereitet auf die Anforderungen und Inhalte der Qualifikationsphase vor
    falsch:
      - Sie bereitet unmittelbar auf die Abiturprüfung vor
      - Sie dient ausschließlich der Berufsorientierung
      - Sie dient dem Erwerb des Mittleren Schulabschlusses
    erklaerung: Die Einführungsphase bereitet auf die Qualifikationsphase vor, die Qualifikationsphase auf die Abiturprüfung.
  - id: g005
    abschnitt: gyo-allgemein
    fundstelle: § 2 Abs. 2
    frage: Was ist laut § 2 fester Bestandteil der Arbeit in der Gymnasialen Oberstufe?
    richtig: Vorbereitung auf die allgemeine Studierfähigkeit sowie Berufs- und Studienorientierung
    falsch:
      - Ein verpflichtendes Auslandshalbjahr
      - Ein Betriebspraktikum in jedem Schuljahr
      - Der Erwerb der Fachhochschulreife als Zwischenabschluss
    erklaerung: Studierfähigkeit sowie Berufs- und Studienorientierung sind ausdrücklich fester Bestandteil.
  - id: g006
    abschnitt: gyo-allgemein
    fundstelle: § 2 Abs. 2
    frage: Wodurch führt die Gymnasiale Oberstufe zur Allgemeinen Hochschulreife?
    richtig: Durch allgemeine Grundbildung verbunden mit individueller Schwerpunktsetzung in Wahlpflicht- und Profilorganisation
    falsch:
      - Durch frei wählbare Kurse ohne Pflichtbindung
      - Ausschließlich durch Leistungskurse
      - Durch eine einheitliche Stundentafel für alle bis zum Abitur
    erklaerung: So beschreibt § 2 Abs. 2 Satz 4 den Weg zur Allgemeinen Hochschulreife.
  - id: g007
    abschnitt: gyo-allgemein
    fundstelle: § 2a Abs. 1
    frage: Wer kann in Bremerhaven Vorbereitungsklassen für die Gymnasiale Oberstufe einrichten?
    richtig: Der Magistrat
    falsch:
      - Die Schulleitung der Oberstufe
      - Ausschließlich die Senatorin für Kinder und Bildung
      - Die Schulkonferenz
    erklaerung: In Bremen die Senatorin für Kinder und Bildung, in Bremerhaven der Magistrat.
  - id: g008
    abschnitt: gyo-allgemein
    fundstelle: § 2a Abs. 1
    frage: Welchen Schwerpunkt hat das erste Jahr einer Vorbereitungsklasse?
    richtig: Sprachförderung
    falsch:
      - Mathematik
      - Berufsorientierung
      - Abiturvorbereitung
    erklaerung: Vorbereitungsklassen dienen der Sprachförderung und der fachunterrichtlichen Vorbereitung; im ersten Jahr liegt der Schwerpunkt auf der Sprachförderung.
  - id: g009
    abschnitt: gyo-allgemein
    fundstelle: § 2a Abs. 1
    frage: Wie lange soll der Besuch einer Vorbereitungsklasse höchstens dauern?
    richtig: Zwei Jahre
    falsch:
      - Ein Jahr
      - Drei Jahre
      - Ein Halbjahr
    erklaerung: Der Besuch der Vorbereitungsklassen soll zwei Jahre nicht überschreiten.
  - id: g010
    abschnitt: gyo-allgemein
    fundstelle: § 2a Abs. 2
    frage: Welche Gruppe von Schülerinnen und Schülern wird nach § 2a GyO-VO einer Vorbereitungsklasse zugewiesen?
    richtig: Wer erstmals in der Sekundarstufe II das deutsche Schulsystem besucht und voraussichtlich die Hochschulreife erwirbt
    falsch:
      - Wer in der Einführungsphase nicht versetzt wurde
      - Wer die Abiturprüfung nicht bestanden hat
      - Wer aus einem Beruflichen Gymnasium wechselt
    erklaerung: Das ist die Gruppe nach Nr. 2. Außerdem werden nach Nr. 1 Schülerinnen und Schüler zugewiesen, die am Ende der Sekundarstufe I unter der Bedingung, ihre Sprachkenntnisse zu verbessern, der Oberstufe zugewiesen wurden.
  - id: g011
    abschnitt: gyo-allgemein
    fundstelle: § 3
    frage: Wie lange beträgt die Verweildauer in der Gymnasialen Oberstufe höchstens, wenn die Abiturprüfung nicht wiederholt wird?
    richtig: Vier Jahre
    falsch:
      - Drei Jahre
      - Fünf Jahre
      - Sechs Jahre
    erklaerung: Die Verweildauer beträgt höchstens vier Jahre.
  - id: g012
    abschnitt: gyo-allgemein
    fundstelle: § 3
    frage: Um wie viel verlängert sich die Verweildauer, wenn eine nicht bestandene Abiturprüfung wiederholt wird?
    richtig: Um ein Jahr
    falsch:
      - Um ein Halbjahr
      - Um zwei Jahre
      - Gar nicht
    erklaerung: Bei Wiederholung der nicht bestandenen Abiturprüfung verlängert sich die Verweildauer um ein Jahr.
  - id: g013
    abschnitt: gyo-allgemein
    fundstelle: § 3
    frage: Was gilt, wenn jemand die Hochschulreife innerhalb der zulässigen Verweildauer nicht mehr erreichen kann?
    richtig: Die Person muss die Oberstufe sofort verlassen
    falsch:
      - Sie darf bis zum Schuljahresende bleiben
      - Die Verweildauer verlängert sich automatisch um ein Jahr
      - Sie wechselt automatisch in eine Vorbereitungsklasse
    erklaerung: Wer das Ziel innerhalb der zulässigen Verweildauer nicht mehr erreichen kann, muss die Oberstufe sofort verlassen.
  - id: g014
    abschnitt: gyo-allgemein
    fundstelle: § 3
    frage: Wer kann in begründeten Ausnahmefällen eine längere Verweildauer zulassen?
    richtig: Die Schulleiterin oder der Schulleiter auf Antrag
    falsch:
      - Die Klassenkonferenz
      - Die Prüfungskommission
      - Niemand, die Höchstdauer ist absolut
    erklaerung: Die Schulleitung kann auf Antrag in begründeten Ausnahmefällen verlängern.
  - id: g015
    abschnitt: gyo-allgemein
    fundstelle: § 4 Abs. 1
    frage: Wer kann in die Einführungsphase eintreten?
    richtig: Wer der Jahrgangsstufe zugewiesen wurde oder die Berechtigung auf andere Weise erworben hat
    falsch:
      - Nur wer ein Gymnasium der Sekundarstufe I besucht hat
      - Jede Person mit Erster Berufsbildungsreife
      - Nur wer eine Aufnahmeprüfung bestanden hat
    erklaerung: Eintreten kann, wer zugewiesen wurde oder auf andere Weise die Berechtigung zum Besuch erworben hat.
  - id: g016
    abschnitt: gyo-allgemein
    fundstelle: § 4 Abs. 2
    frage: Eine Schülerin ist erstmals in der Sekundarstufe II ins deutsche Schulsystem eingetreten, hat eine Vorbereitungsklasse besucht und den Mittleren Schulabschluss erworben. Welche Notenvoraussetzung gilt zusätzlich für ihren Zugang zur Gymnasialen Oberstufe?
    richtig: Durchschnitt 3,0 oder besser in Deutsch, Mathematik und erster Fremdsprache sowie mindestens 3,0 in allen Fächern
    falsch:
      - Durchschnitt 2,5 oder besser in allen Fächern
      - Mindestens Note 4 in allen Fächern
      - Durchschnitt 3,0 oder besser nur in Deutsch
    erklaerung: Die Berechtigung wird dann im Prüfungszeugnis ausgewiesen.
  - id: g017
    abschnitt: gyo-allgemein
    fundstelle: § 4 Abs. 3
    frage: Was brauchen Schülerinnen und Schüler privater Ersatzschulen, die nicht nach den Verordnungen für die Sekundarstufe I zugewiesen wurden, für den Zugang?
    richtig: Mittleren Schulabschluss und Durchschnitt 3,0 oder besser in D, M, erster Fremdsprache sowie mindestens 3,0 in allen Fächern
    falsch:
      - Eine bestandene Aufnahmeprüfung an der Oberstufe
      - Nur den Mittleren Schulabschluss
      - Eine Empfehlung der abgebenden Schule
    erklaerung: Für Privatschulen gelten dieselben Notenbedingungen; die Berechtigung wird im Zeugnis ausgewiesen.
  - id: g018
    abschnitt: gyo-allgemein
    fundstelle: § 4 Abs. 4
    frage: Wer entscheidet über Ausnahmen beim Zugang, die in der Person der Schülerin oder des Schülers begründet sind?
    richtig: Die Senatorin für Kinder und Bildung
    falsch:
      - Die aufnehmende Schulleitung
      - Die Klassenkonferenz der abgebenden Schule
      - Der Schulelternbeirat
    erklaerung: Aufgenommen werden kann, wenn ein erfolgreicher Durchlauf der Oberstufe zu erwarten ist.
  - id: g019
    abschnitt: gyo-allgemein
    fundstelle: § 5
    frage: Wie regelt § 5 die Verantwortung für die eigene Schullaufbahn?
    richtig: Schülerinnen und Schüler müssen sich informieren, die Schule hat eine Beratungspflicht, die Beratung wird dokumentiert
    falsch:
      - Allein die Schule haftet für eine korrekte Belegung
      - Die Eltern müssen jede Kursbelegung schriftlich genehmigen
      - Beratung gibt es nur auf schriftlichen Antrag und ohne Dokumentation
    erklaerung: Informationspflicht der Schüler, Beratungspflicht der Schule, Dokumentation der Beratung.
  - id: g020
    abschnitt: gyo-allgemein
    fundstelle: § 5
    frage: Worauf bezieht sich die Beratungspflicht der Schule außerdem?
    richtig: Auf mögliche Abschlüsse, falls das Bildungsgangsziel nicht erreicht wird
    falsch:
      - Auf die Studienplatzvergabe
      - Auf Nachhilfe außerhalb der Schule
      - Auf die Wahl des Ausbildungsbetriebs
    erklaerung: Die Pflicht umfasst auch mögliche Abschlüsse bei Nichterreichen des Bildungsgangsziels.
  - id: g021
    abschnitt: gyo-unterricht
    fundstelle: § 6 Abs. 1
    frage: Wer legt das Wahlpflicht-, Profil-, Fach- und Kursangebot einer Schule fest?
    richtig: Die Schule selbst, nach ihren Möglichkeiten und abgestimmt mit benachbarten Oberstufen
    falsch:
      - Die Senatorin einheitlich für alle Schulen
      - Die Schülervertretung
      - Der Zentralelternbeirat
    erklaerung: Die Schule legt ihr Angebot nach personellen, räumlichen und sächlichen Möglichkeiten fest.
  - id: g022
    abschnitt: gyo-unterricht
    fundstelle: § 6 Abs. 1
    frage: Was muss die Senatorin für Kinder und Bildung am Unterrichtsangebot einer Oberstufe genehmigen?
    richtig: Das Profilangebot und die schulübergreifenden Kurse
    falsch:
      - Jeden einzelnen Grundkurs
      - Die Stundenpläne der Lehrkräfte
      - Die Klausurtermine
    erklaerung: Profilangebot und schulübergreifende Kurse sind genehmigungspflichtig.
  - id: g023
    abschnitt: gyo-unterricht
    fundstelle: § 6 Abs. 1
    frage: Welche Fächer und Kurse haben bei der Angebotsplanung Vorrang?
    richtig: Solche, deren Belegung zur Erfüllung von Auflagen nötig ist
    falsch:
      - Solche mit den meisten Anmeldungen
      - Naturwissenschaftliche Leistungskurse
      - Bilinguale Kurse
    erklaerung: Vorrang haben Fächer und Kurse, die für die Erfüllung von Auflagen erforderlich sind.
  - id: g024
    abschnitt: gyo-unterricht
    fundstelle: § 6 Abs. 2
    frage: Haben Schülerinnen und Schüler Anspruch darauf, bestimmte Fächer zu belegen?
    richtig: Nein, ein solcher Anspruch besteht nicht
    falsch:
      - Ja, für alle Fächer der Anlage 1
      - Ja, aber nur für Leistungskurse
      - Ja, ab zehn Anmeldungen
    erklaerung: "Ausdrücklich: kein Anspruch auf bestimmte Fächer."
  - id: g025
    abschnitt: gyo-unterricht
    fundstelle: § 7 Abs. 1
    frage: In welcher Form ist der Unterricht in der Einführungsphase organisiert?
    richtig: Im Klassenverband
    falsch:
      - Im Kurssystem aus Grund- und Leistungskursen
      - In jahrgangsübergreifenden Gruppen
      - Als Projektunterricht ohne feste Gruppen
    erklaerung: "Einführungsphase: Klassenverband mit Stundentafel nach Anlage 2."
  - id: g026
    abschnitt: gyo-unterricht
    fundstelle: § 7 Abs. 1
    frage: Wo erfolgt in der Einführungsphase die individuelle Schwerpunktbildung?
    richtig: Im Wahlpflichtbereich
    falsch:
      - In den Leistungskursen
      - In der Projektarbeit
      - Im Förderunterricht
    erklaerung: Die individuelle Schwerpunktbildung erfolgt im Rahmen des Wahlpflichtbereichs.
  - id: g027
    abschnitt: gyo-unterricht
    fundstelle: § 7 Abs. 2
    frage: Auf welchem Anforderungsniveau werden Leistungskurse unterrichtet?
    richtig: Auf erhöhtem Anforderungsniveau
    falsch:
      - Auf grundlegendem Anforderungsniveau
      - Auf mittlerem Anforderungsniveau
      - Ohne festgelegtes Niveau
    erklaerung: "Leistungskurse: erhöhtes, Grundkurse: grundlegendes Anforderungsniveau."
  - id: g028
    abschnitt: gyo-unterricht
    fundstelle: § 7 Abs. 2 Nr. 1
    frage: Woraus setzt sich ein Profil in der Qualifikationsphase zusammen?
    richtig: Aus einem Leistungskurs und mindestens zwei Grundkursen
    falsch:
      - Aus zwei Leistungskursen und einem Grundkurs
      - Aus drei beliebigen Grundkursen
      - Aus einem Leistungskurs und der Projektarbeit
    erklaerung: Jeweils ein Leistungskurs und mindestens zwei Grundkurse bilden ein Profil.
  - id: g029
    abschnitt: gyo-unterricht
    fundstelle: § 7 Abs. 2 Nr. 2
    frage: Darf ein Leistungskurs aus Grundkurs plus ergänzendem Zusatzkurs gebildet werden?
    richtig: Nur in Ausnahmefällen
    falsch:
      - Ja, das ist der Regelfall
      - Nein, niemals
      - Nur im Fach Sport
    erklaerung: Ein solcher Verbund ist nur in Ausnahmefällen zulässig.
  - id: g030
    abschnitt: gyo-unterricht
    fundstelle: § 7 Abs. 2 Nr. 3
    frage: In der Qualifikationsphase bauen die Halbjahreskurse grundsätzlich inhaltlich aufeinander auf. Für welche Kurse gilt das nicht?
    richtig: Kurse in Sportpraxis
    falsch:
      - Kurse in Fremdsprachen
      - Kurse in Mathematik
      - Kurse in Darstellendem Spiel
    erklaerung: Halbjahreskurse bauen aufeinander auf, mit Ausnahme der Kurse in Sportpraxis.
  - id: g031
    abschnitt: gyo-unterricht
    fundstelle: § 7 Abs. 3
    frage: Welche Rolle spielen fachübergreifende Lernformen?
    richtig: Sie ergänzen das fachliche Lernen und sind Bestandteil des Unterrichts
    falsch:
      - Sie ersetzen Grundkurse
      - Sie sind freiwillige AGs außerhalb des Unterrichts
      - Sie sind nur in der Einführungsphase zulässig
    erklaerung: Fachübergreifende Lernformen sind Bestandteil des Unterrichts.
  - id: g032
    abschnitt: gyo-unterricht
    fundstelle: § 7 Abs. 4
    frage: Welche Fächer bilden das Aufgabenfeld II?
    richtig: Die gesellschaftswissenschaftlichen Fächer
    falsch:
      - Die sprachlich-literarisch-künstlerischen Fächer
      - Die mathematisch-naturwissenschaftlich-technischen Fächer
      - Sport und Darstellendes Spiel
    erklaerung: Aufgabenfeld I sprachlich-literarisch-künstlerisch, Aufgabenfeld II gesellschaftswissenschaftlich, Aufgabenfeld III mathematisch-naturwissenschaftlich-technisch.
  - id: g033
    abschnitt: gyo-unterricht
    fundstelle: § 7 Abs. 4
    frage: Welches Unterrichtsfach ist keinem Aufgabenfeld zugeordnet?
    richtig: Sport
    falsch:
      - Informatik
      - Philosophie
      - Darstellendes Spiel
    erklaerung: Alle Fächer außer Sport werden Aufgabenfeldern zugeordnet.
  - id: g034
    abschnitt: gyo-unterricht
    fundstelle: § 7 Abs. 5
    frage: Was ist zwischen Vormittags- und Nachmittagsunterricht vorzuhalten?
    richtig: Eine Mittagspause
    falsch:
      - Eine Selbstlernstunde
      - Ein Förderangebot
      - Eine Freistunde pro Woche
    erklaerung: Außerdem ist bei Nachmittagsunterricht die zeitliche Belastung bei Hausaufgaben zu berücksichtigen.
  - id: g035
    abschnitt: gyo-unterricht
    fundstelle: § 8 Abs. 1
    frage: Welches dieser Fächer gehört NICHT zu den Fächern, die nach § 8 Abs. 1 GyO-VO in der gesamten Oberstufe durchgehend belegt werden müssen?
    richtig: Geschichte
    falsch:
      - Sport
      - Mathematik
      - Eine Naturwissenschaft
    erklaerung: "Durchgehend: Deutsch, fortgesetzte Fremdsprache, Mathematik, eine Naturwissenschaft, ein gesellschaftswissenschaftliches Fach, Sport. Geschichte ist eine eigene Auflage."
  - id: g036
    abschnitt: gyo-unterricht
    fundstelle: § 8 Abs. 1
    frage: Wann gilt eine Fremdsprache als fortgesetzt?
    richtig: Wenn sie in den zwei Jahrgangsstufen vor Eintritt in die Oberstufe belegt wurde
    falsch:
      - Wenn sie mindestens ein Jahr in der Sekundarstufe I belegt wurde
      - Wenn sie ab Klasse 5 belegt wurde
      - Wenn sie in der Einführungsphase vierstündig belegt wird
    erklaerung: Maßgeblich sind die beiden Jahrgangsstufen vor Eintritt in die Oberstufe.
  - id: g037
    abschnitt: gyo-unterricht
    fundstelle: § 8 Abs. 2
    fall: true
    frage: Eine Schülerin hatte bis zum Eintritt in die Oberstufe keinen durchgehenden Unterricht in einer zweiten Fremdsprache über mindestens vier aufeinanderfolgende Jahrgangsstufen. Welche zusätzliche Belegverpflichtung hat sie?
    richtig: Eine weitere Fremdsprache in der Einführungsphase und in beiden Jahren der Qualifikationsphase mit je 4 Jahreswochenstunden
    falsch:
      - Keine, die fortgesetzte Fremdsprache genügt
      - Eine zweite Fremdsprache nur in der Einführungsphase
      - Eine externe Sprachprüfung bis zum Abitur
    erklaerung: Ergänzend zur fortgesetzten Fremdsprache nach § 8 Abs. 1 Nr. 2 ist dann eine weitere Fremdsprache über drei Jahre mit je 4 Jahreswochenstunden zu belegen.
  - id: g038
    abschnitt: gyo-unterricht
    fundstelle: § 8 Abs. 3
    frage: Mit wie vielen Wochenstunden wird eine in der Oberstufe neu aufgenommene Fremdsprache unterrichtet?
    richtig: Vier
    falsch:
      - Drei
      - Zwei
      - Fünf
    erklaerung: Neu aufgenommene Fremdsprachen werden vierstündig unterrichtet.
  - id: g039
    abschnitt: gyo-unterricht
    fundstelle: § 8 Abs. 3
    frage: Ist eine Fremdsprache, die in den beiden Jahrgangsstufen vor der Oberstufe belegt wurde, „neu aufgenommen“?
    richtig: Nein
    falsch:
      - Ja, wenn sie erst in Klasse 9 begann
      - Ja, bei Noten schlechter als 4
      - Das entscheidet die Schulleitung
    erklaerung: Eine in den beiden Jahrgangsstufen davor belegte Fremdsprache ist keine neu aufgenommene.
  - id: g040
    abschnitt: gyo-unterricht
    fundstelle: § 8 Abs. 4
    frage: Ein Schüler hatte in der Sekundarstufe I kein Englisch und muss es in der Einführungsphase neu aufnehmen. Mit wie vielen Jahreswochenstunden ist Englisch in den drei Jahren der Oberstufe insgesamt zu unterrichten?
    richtig: "12"
    falsch:
      - "8"
      - "9"
      - "15"
    erklaerung: Englisch ist dann insgesamt mit 12 Jahreswochenstunden zu unterrichten, im Schnitt also 4 Wochenstunden pro Schuljahr.
  - id: g041
    abschnitt: gyo-unterricht
    fundstelle: § 9 Abs. 1
    frage: In welchem Halbjahr der Einführungsphase müssen spätere Leistungskurs- und Prüfungsfächer belegt sein?
    richtig: Im zweiten Halbjahr
    falsch:
      - Im ersten Halbjahr
      - In beiden Halbjahren
      - Gar nicht
    erklaerung: Die Schulleitung kann Ausnahmen zulassen.
  - id: g042
    abschnitt: gyo-unterricht
    fundstelle: § 9 Abs. 2 Nr. 1
    frage: Wie viele der Fächer Biologie, Chemie und Physik sind in der Einführungsphase mindestens zu belegen?
    richtig: Zwei
    falsch:
      - Eines
      - Drei
      - Keines
    erklaerung: Mindestens zwei der drei Naturwissenschaften.
  - id: g043
    abschnitt: gyo-unterricht
    fundstelle: § 9 Abs. 2 Nr. 2
    frage: Welches gesellschaftswissenschaftliche Fach ist in der Einführungsphase verpflichtend?
    richtig: Geschichte
    falsch:
      - Politik
      - Geographie
      - Wirtschaftslehre
    erklaerung: Geschichte ist in der Einführungsphase ausdrücklich zu belegen.
  - id: g044
    abschnitt: gyo-unterricht
    fundstelle: § 9 Abs. 2 Nr. 3
    frage: Wie viel Methodenunterricht ist in der Einführungsphase mindestens zu belegen?
    richtig: Eine Wochenstunde
    falsch:
      - Zwei Wochenstunden
      - Drei Wochenstunden
      - Keiner
    erklaerung: Mindestens eine Wochenstunde Methodenunterricht.
  - id: g045
    abschnitt: gyo-unterricht
    fundstelle: § 9 Abs. 3
    frage: Der Wahlpflichtbereich der Einführungsphase umfasst nach Anlage 2 unter anderem neue Fächer (Nr. 1) und Fremdsprachen (Nr. 2). Welchen Mindestumfang müssen diese beiden Nummern zusammen haben?
    richtig: 4 Unterrichtsstunden
    falsch:
      - 2 Unterrichtsstunden
      - 6 Unterrichtsstunden
      - 8 Unterrichtsstunden
    erklaerung: Der Wahlpflichtbereich umfasst in den Nummern 1 und 2 mindestens 4 Unterrichtsstunden.
  - id: g046
    abschnitt: gyo-unterricht
    fundstelle: § 9 Abs. 4
    frage: Wie viele Wochenstunden sind in der Einführungsphase mindestens zu belegen?
    richtig: "35"
    falsch:
      - "30"
      - "32"
      - "38"
    erklaerung: Mindestens 35 Stunden.
  - id: g047
    abschnitt: gyo-unterricht
    fundstelle: § 9 Abs. 4
    frage: Wie viel Selbstlernzeit kann in der Einführungsphase angerechnet werden?
    richtig: Bis zu zwei Jahreswochenstunden
    falsch:
      - Bis zu vier Jahreswochenstunden
      - Bis zu sechs Jahreswochenstunden
      - Keine
    erklaerung: Bis zu zwei Jahreswochenstunden Selbstlernzeit sind anrechenbar.
  - id: g048
    abschnitt: gyo-unterricht
    fundstelle: § 10 Abs. 1
    frage: Wie viele Leistungskurse müssen in der Qualifikationsphase belegt werden?
    richtig: Mindestens zwei, ein dritter ist zulässig
    falsch:
      - Genau drei
      - Höchstens einer pro Profil
      - Genau zwei
    erklaerung: Mindestens zwei Leistungskurse, einer davon im Profil; ein dritter Leistungskurs ist zulässig.
  - id: g049
    abschnitt: gyo-unterricht
    fundstelle: § 10 Abs. 2
    frage: Welche Vorgabe macht § 10 Abs. 2 GyO-VO für die Wahl der Leistungskurse?
    richtig: Eines der Fächer Deutsch, fortgesetzte Fremdsprache, Mathematik oder eine Naturwissenschaft muss LK sein
    falsch:
      - Deutsch muss immer LK sein
      - Mindestens ein LK muss aus Aufgabenfeld II sein
      - Beide LK müssen aus unterschiedlichen Aufgabenfeldern sein
    erklaerung: Eines der Fächer nach § 8 Abs. 1 Nr. 1 bis 4 muss Leistungskurs sein.
  - id: g050
    abschnitt: gyo-unterricht
    fundstelle: § 10 Abs. 2
    fall: true
    frage: Ein Schüler wählt Biologie als einen seiner beiden Pflicht-Leistungskurse. Welche Fächer kommen für den anderen Leistungskurs in Frage?
    richtig: Deutsch, eine fortgesetzte Fremdsprache, Mathematik oder ein Fach aus Aufgabenfeld II
    falsch:
      - Jedes beliebige Fach
      - Nur eine weitere Naturwissenschaft
      - Nur Kunst, Musik oder Darstellendes Spiel
    erklaerung: Ist der LK eine Naturwissenschaft, muss der weitere LK ein Fach nach § 8 Abs. 1 Nr. 1 bis 3 oder aus Aufgabenfeld II sein.
  - id: g051
    abschnitt: gyo-unterricht
    fundstelle: § 10 Abs. 3 Nr. 1
    frage: Wie lässt sich die Geschichtsauflage in der Qualifikationsphase erfüllen?
    richtig: Geschichte zwei aufeinanderfolgende Halbjahre oder Politik mit historischen Anteilen vier aufeinanderfolgende Halbjahre
    falsch:
      - Geschichte ein Halbjahr
      - Politik zwei Halbjahre
      - Eine Projektarbeit mit historischem Thema
    erklaerung: Beide Wege nennt § 10 Abs. 3 Nr. 1.
  - id: g052
    abschnitt: gyo-unterricht
    fundstelle: § 10 Abs. 3 Nr. 2
    frage: Welche Belegung gilt für Religion oder Philosophie in der Qualifikationsphase?
    richtig: Eines der beiden Fächer zwei aufeinanderfolgende Halbjahre
    falsch:
      - Beide Fächer je ein Halbjahr
      - Eines der beiden vier Halbjahre
      - Keine Pflicht
    erklaerung: Religion oder Philosophie in zwei aufeinanderfolgenden Halbjahren.
  - id: g053
    abschnitt: gyo-unterricht
    fundstelle: § 10 Abs. 3 Nr. 3
    frage: Welche Belegung gilt für den künstlerischen Bereich in der Qualifikationsphase?
    richtig: Kunst, Musik oder Darstellendes Spiel zwei aufeinanderfolgende Halbjahre
    falsch:
      - Kunst und Musik je zwei Halbjahre
      - Ein künstlerisches Fach vier Halbjahre
      - Keine Pflicht
    erklaerung: Eines der drei Fächer in zwei aufeinanderfolgenden Halbjahren.
  - id: g054
    abschnitt: gyo-unterricht
    fundstelle: § 10 Abs. 4
    frage: Wie wird ein Kurs mit 0 Punkten oder „nicht beurteilbar“ behandelt?
    richtig: Er gilt als nicht belegt
    falsch:
      - Er gilt als belegt, aber nicht einbringbar
      - Er zählt wie 2 Punkte
      - Er muss nachgeschrieben werden
    erklaerung: Ein solcher Kurs gilt als nicht belegt.
  - id: g055
    abschnitt: gyo-unterricht
    fundstelle: § 10 Abs. 5
    frage: Darf in der Qualifikationsphase ein Halbjahr übersprungen werden?
    richtig: Nein
    falsch:
      - Ja, mit Genehmigung der Schulleitung
      - Ja, ab Notendurchschnitt 1,5
      - Nur das erste Halbjahr
    erklaerung: In der Qualifikationsphase darf kein Halbjahr übersprungen werden.
  - id: g056
    abschnitt: gyo-unterricht
    fundstelle: § 10 Abs. 6 Nr. 1
    frage: Wie viele Jahreswochenstunden sind in der Qualifikationsphase mindestens zu belegen?
    richtig: "68"
    falsch:
      - "60"
      - "72"
      - "80"
    erklaerung: Mindestens 68 Jahreswochenstunden.
  - id: g057
    abschnitt: gyo-unterricht
    fundstelle: § 10 Abs. 6 Nr. 1
    frage: Wer darf die Belegverpflichtung von 68 Jahreswochenstunden in der Qualifikationsphase um sechs Jahreswochenstunden unterschreiten?
    richtig: Wer in der Sekundarstufe I sechs aufeinanderfolgende Jahrgangsstufen besucht hat
    falsch:
      - Wer drei Leistungskurse belegt
      - Wer eine besondere Lernleistung einbringt
      - Wer ein Praktikum macht
    erklaerung: Sechs aufeinanderfolgende Jahrgangsstufen in der Sekundarstufe I erlauben eine Unterschreitung um 6 Jahreswochenstunden.
  - id: g058
    abschnitt: gyo-unterricht
    fundstelle: § 10 Abs. 6 Nr. 2–3
    frage: Wie viel Selbstlernzeit im Rahmen der Projektarbeit kann in der Q-Phase angerechnet werden?
    richtig: Bis zu vier Jahreswochenstunden, aber nur bis zu zwei, wenn in der E-Phase schon zwei angerechnet wurden
    falsch:
      - Immer bis zu sechs Jahreswochenstunden
      - Bis zu zwei Jahreswochenstunden, unabhängig von der E-Phase
      - Keine
    erklaerung: Nr. 2 erlaubt bis zu vier, Nr. 3 begrenzt auf zwei, wenn nach § 9 Abs. 4 bereits zwei angerechnet wurden.
  - id: g059
    abschnitt: gyo-unterricht
    fundstelle: § 10 Abs. 7
    frage: Mit wie vielen Wochenstunden werden Leistungskurse unterrichtet?
    richtig: Fünf
    falsch:
      - Vier
      - Sechs
      - Drei
    erklaerung: "Leistungskurse: fünf Wochenstunden."
  - id: g060
    abschnitt: gyo-unterricht
    fundstelle: § 10 Abs. 7
    frage: Mit wie vielen Wochenstunden werden Grundkurse in Deutsch, Fremdsprachen und Mathematik unterrichtet?
    richtig: Drei
    falsch:
      - Zwei
      - Vier
      - Fünf
    erklaerung: Diese Grundkurse sind dreistündig; Grundkurse mit schriftlicher Abiturprüfung sollen ebenfalls dreistündig sein.
  - id: g061
    abschnitt: gyo-unterricht
    fundstelle: § 10 Abs. 7
    frage: Mit wie vielen Wochenstunden werden in der Qualifikationsphase die übrigen Grundkurse unterrichtet, also weder Deutsch, Fremdsprachen und Mathematik noch Sonderfälle wie neu aufgenommene Fremdsprachen oder Sport als 4. Prüfungsfach?
    richtig: Drei, mindestens aber zwei
    falsch:
      - Immer genau zwei
      - Vier
      - Eine bis zwei
    erklaerung: Die übrigen Grundkurse werden mit drei, mindestens aber mit zwei Wochenstunden unterrichtet.
  - id: g062
    abschnitt: gyo-unterricht
    fundstelle: § 10 Abs. 8
    frage: Wie viel Zeit ist in den Profilen im ersten Q-Jahr zusätzlich für die Projektarbeit vorzusehen?
    richtig: Zwei Wochenstunden
    falsch:
      - Eine Wochenstunde
      - Vier Wochenstunden
      - Ein Projekttag pro Monat
    erklaerung: Zwei zusätzliche Wochenstunden, unterrichtet im Rahmen der Profile.
  - id: g063
    abschnitt: gyo-unterricht
    fundstelle: § 10a Abs. 1
    frage: Wann und in welchem Rahmen entsteht die Projektarbeit?
    richtig: In einem Halbjahr der Q-Phase, in einem fachübergreifenden Projekt mit mindestens zwei Fächern
    falsch:
      - In der E-Phase im Fach Deutsch
      - Über die ganze Q-Phase in einem Fach
      - Nach dem Abitur als Zusatzleistung
    erklaerung: Ein Halbjahr der Qualifikationsphase, mindestens zwei beteiligte Fächer.
  - id: g064
    abschnitt: gyo-unterricht
    fundstelle: § 10a Abs. 2
    frage: Aus welchen Bestandteilen setzt sich die Projektarbeit zusammen?
    richtig: Projektergebnisse, Präsentation und Gespräch über die Ergebnisse
    falsch:
      - Hausarbeit und Klausur
      - Portfolio und mündliche Prüfung
      - Projektergebnisse und Lehrergutachten
    erklaerung: Das Gespräch führen die Lehrkräfte der beteiligten Fächer.
  - id: g065
    abschnitt: gyo-unterricht
    fundstelle: § 10a Abs. 3
    fall: true
    frage: Eine Gruppe legt als Ergebnis ihrer Projektarbeit in der Qualifikationsphase einen Kurzfilm vor. Was muss sie zusätzlich einreichen?
    richtig: Eine schriftliche Reflexion des Projektergebnisses
    falsch:
      - Eine zusätzliche Klausur
      - Nichts
      - Ein externes Gutachten
    erklaerung: Liegt das Ergebnis nicht in Schriftform vor (mediales Produkt, Objekt, szenische oder musikalische Darstellung), ist eine schriftliche Reflexion zu ergänzen.
  - id: g066
    abschnitt: gyo-unterricht
    fundstelle: § 10a Abs. 4
    frage: Wer genehmigt das Thema der Projektarbeit?
    richtig: Die Lehrkräfte der beteiligten Fächer
    falsch:
      - Die Schulleitung
      - Die Senatorin
      - Der Fachprüfungsausschuss
    erklaerung: Genehmigt wird von den Lehrkräften der beteiligten Fächer.
  - id: g067
    abschnitt: gyo-unterricht
    fundstelle: § 10a Abs. 4
    frage: Wer bewertet die Projektarbeit?
    richtig: Zwei an der Projektarbeit beteiligte Lehrkräfte
    falsch:
      - Die Prüfungskommission
      - Die Fachprüfungsleitung
      - Alle beteiligten Lehrkräfte und die Schulleitung
    erklaerung: Zwei beteiligte Lehrkräfte bewerten; die Bewertung ist zu dokumentieren.
  - id: g068
    abschnitt: gyo-unterricht
    fundstelle: § 10a Abs. 5
    frage: Darf die Projektarbeit als Gruppenarbeit angefertigt werden?
    richtig: Ja, wenn die individuelle Leistung nachweisbar und bewertbar ist
    falsch:
      - Nein, nur als Einzelarbeit
      - Ja, alle bekommen dieselbe Note
      - Nur mit Genehmigung der Senatorin
    erklaerung: Einzel- oder Gruppenarbeit ist möglich; die individuelle Leistung muss erkennbar sein.
  - id: g069
    abschnitt: gyo-unterricht
    fundstelle: § 10a Abs. 6
    frage: Was gilt für eine mit 0 Punkten bewertete Projektarbeit?
    richtig: Sie gilt als nicht angefertigt
    falsch:
      - Sie wird einfach statt doppelt eingebracht
      - Sie wird durch eine mündliche Prüfung ersetzt
      - Sie zählt als belegt ohne Punkte
    erklaerung: Die Projektarbeit geht in die Gesamtqualifikation ein; mit 0 Punkten gilt sie als nicht angefertigt.
  - id: g070
    abschnitt: gyo-unterricht
    fundstelle: § 11 Abs. 1
    frage: Bis wann ist ein Wechsel von Fächern im Wahlpflichtbereich zulässig?
    richtig: Bis spätestens Ende des ersten Halbjahres der Einführungsphase
    falsch:
      - Bis Ende der Einführungsphase
      - Bis Ende des ersten Q-Jahres
      - Jederzeit
    erklaerung: Die Schulleitung kann Ausnahmen von dieser Frist zulassen.
  - id: g071
    abschnitt: gyo-unterricht
    fundstelle: § 11 Abs. 2
    frage: Was gilt für Änderungen der Belegung in der Qualifikationsphase?
    richtig: Sie bedürfen der Zustimmung der Schulleitung
    falsch:
      - Sie sind ausgeschlossen
      - Sie sind ohne Zustimmung möglich
      - Die Senatorin muss zustimmen
    erklaerung: Belegungsänderungen in der Q-Phase brauchen die Zustimmung der Schulleiterin oder des Schulleiters.
  - id: g072
    abschnitt: gyo-unterricht
    fundstelle: § 12 Abs. 1
    frage: Was nennt § 12 Abs. 1 GyO-VO NICHT ausdrücklich als Grundlage der Leistungsbewertung in der Oberstufe?
    richtig: Selbsteinschätzungen der Schülerinnen und Schüler
    falsch:
      - Klausuren und weitere schriftliche Arbeiten
      - Präsentationen von Projekten
      - Hausarbeiten
    erklaerung: Genannt werden Klausuren, schriftliche Arbeiten, mündliche Leistungen, Hausarbeiten, Präsentationen, praktische Tätigkeiten und laufende Unterrichtsarbeit.
  - id: g073
    abschnitt: gyo-unterricht
    fundstelle: § 12 Abs. 2 Nr. 1
    frage: Wie viele Klausuren pro Halbjahr gibt es in der E-Phase mindestens in Deutsch, Mathematik und erster Fremdsprache?
    richtig: Zwei, eine davon durch Referat oder Präsentation ersetzbar
    falsch:
      - Eine
      - Drei
      - Zwei, keine ersetzbar
    erklaerung: Mindestens zwei; eine kann durch eine vergleichbare Leistung ersetzt werden.
  - id: g074
    abschnitt: gyo-unterricht
    fundstelle: § 12 Abs. 2 Nr. 2
    frage: Wie viele Klausuren pro Halbjahr gibt es in der E-Phase mindestens in den übrigen Fächern?
    richtig: Eine
    falsch:
      - Zwei
      - Keine
      - Eine pro Schuljahr
    erklaerung: In den übrigen Fächern mindestens eine Klausur je Halbjahr.
  - id: g075
    abschnitt: gyo-unterricht
    fundstelle: § 12 Abs. 3 Nr. 2
    frage: Wie viele Klausuren gibt es in Leistungskursen in den ersten drei Q-Halbjahren mindestens?
    richtig: Zwei pro Halbjahr, eine davon ersetzbar
    falsch:
      - Eine pro Halbjahr
      - Drei pro Halbjahr
      - Zwei pro Schuljahr
    erklaerung: Mindestens zwei je Halbjahr; eine kann durch Referat oder Präsentation ersetzt werden.
  - id: g076
    abschnitt: gyo-unterricht
    fundstelle: § 12 Abs. 3
    frage: Welcher Kurs ist von der Pflicht ausgenommen, in jedem Q-Halbjahr mindestens eine Klausur zu schreiben?
    richtig: Der Grundkurs Sport (Sportpraxis)
    falsch:
      - Der Grundkurs Kunst
      - Der dritte Leistungskurs
      - Kurse im vierten Prüfungsfach
    erklaerung: Die Ausnahme gilt ausdrücklich für den Grundkurs Sport (Sportpraxis).
  - id: g077
    abschnitt: gyo-unterricht
    fundstelle: § 12 Abs. 4
    frage: Woran sollen sich Klausuren bis zum Ende der Q-Phase zunehmend orientieren?
    richtig: An den Anforderungen der schriftlichen Abiturprüfung
    falsch:
      - An den Bildungsstandards der Sekundarstufe I
      - An Vorgaben der Hochschulen
      - An Vergleichsarbeiten
    erklaerung: Die Anforderungen nähern sich zunehmend denen der schriftlichen Abiturprüfung an.
  - id: g078
    abschnitt: gyo-unterricht
    fundstelle: § 12 Abs. 5
    frage: In welchen Kursen wird im zweiten Q-Jahr eine Klausur in Abiturdauer geschrieben?
    richtig: In den Kursen des ersten bis dritten Prüfungsfachs
    falsch:
      - In allen Kursen
      - Nur in den Leistungskursen
      - Im vierten Prüfungsfach
    erklaerung: Jeweils eine Klausur in Abiturdauer in den Kursen des 1. bis 3. Prüfungsfachs.
  - id: g079
    abschnitt: gyo-unterricht
    fundstelle: § 12 Abs. 5
    frage: Wann findet die Klausur in Abiturdauer im dritten Prüfungsfach statt?
    richtig: Nach der Meldung zum Abitur im gewählten Prüfungsfach
    falsch:
      - Im ersten Q-Halbjahr
      - Am Ende der E-Phase
      - Nach der zweiten Prüfungskonferenz
    erklaerung: Im dritten Prüfungsfach findet sie nach der Meldung zum Abitur statt.
  - id: g080
    abschnitt: gyo-unterricht
    fundstelle: § 12 Abs. 6
    frage: Eine Schülerin täuscht in einer Kursklausur der Qualifikationsphase, also nicht in der Abiturprüfung. Was sieht § 12 Abs. 6 GyO-VO vor?
    richtig: Die Leistung kann bis hin zu 0 Punkten abgewertet werden, je nach Schwere und Umfang der Täuschung
    falsch:
      - Die Oberstufe gilt als nicht bestanden
      - Sie wird automatisch nicht zur Abiturprüfung zugelassen
      - Die Klausur wird in jedem Fall wiederholt
    erklaerung: Die Punktzahl wird entsprechend der Schwere und des Umfangs der Täuschungshandlung reduziert, im äußersten Fall auf 0 Punkte. Für die Abiturprüfung gilt dagegen § 5 AP-V.
  - id: g081
    abschnitt: gyo-unterricht
    fundstelle: § 12 Abs. 7
    fall: true
    frage: Welcher Note mit Tendenz entsprechen 10 Punkte in der Punkteskala der Oberstufe?
    richtig: 2−
    falsch:
      - 2+
      - 3+
      - "2"
    erklaerung: 12 = 2+, 11 = 2, 10 = 2−.
  - id: g082
    abschnitt: gyo-unterricht
    fundstelle: § 12 Abs. 7
    fall: true
    frage: Welcher Note mit Tendenz entsprechen 4 Punkte in der Punkteskala der Oberstufe?
    richtig: 4−
    falsch:
      - "4"
      - 5+
      - 4+
    erklaerung: 6 = 4+, 5 = 4, 4 = 4−, 3 = 5+.
  - id: g083
    abschnitt: gyo-unterricht
    fundstelle: § 12 Abs. 7
    fall: true
    frage: Wie viele Punkte entsprechen in der Punkteskala der Oberstufe der Note 1−?
    richtig: "13"
    falsch:
      - "14"
      - "12"
      - "15"
    erklaerung: 15 = 1+, 14 = 1, 13 = 1−.
  - id: g084
    abschnitt: gyo-unterricht
    fundstelle: § 12 Abs. 7
    fall: true
    frage: Welcher Note entsprechen 0 Punkte in der Punkteskala der Oberstufe?
    richtig: "6"
    falsch:
      - 5−
      - "5"
      - „nicht beurteilbar“
    erklaerung: 3 bis 1 Punkte sind die Note 5, 0 Punkte die Note 6.
  - id: g085
    abschnitt: gyo-unterricht
    fundstelle: § 13 Abs. 1
    frage: Wonach sind die Sportarten im Fach Sport geordnet?
    richtig: Nach Bewegungsfeldern
    falsch:
      - Nach Aufgabenfeldern
      - Nach Mannschafts- und Einzelsport
      - Nach Schwierigkeitsgrad
    erklaerung: Die Sportarten sind nach Bewegungsfeldern geordnet (Anlage 3).
  - id: g086
    abschnitt: gyo-unterricht
    fundstelle: § 13 Abs. 2
    frage: Was muss in der Qualifikationsphase belegen, wer Sport als Grundkurs hat?
    richtig: In der Q-Phase Kurse in zwei Sportarten aus zwei Bewegungsfeldern
    falsch:
      - Eine Sportart durchgehend
      - Drei Sportarten aus drei Bewegungsfeldern
      - Sporttheorie in jedem Halbjahr
    erklaerung: "Grundkurs: zwei Sportarten aus zwei verschiedenen Bewegungsfeldern."
  - id: g087
    abschnitt: gyo-unterricht
    fundstelle: § 13 Abs. 3
    frage: Wie viele Sportarten werden im Leistungskurs Sport in der Q-Phase unterrichtet?
    richtig: Drei Sportarten aus drei verschiedenen Bewegungsfeldern
    falsch:
      - Zwei aus zwei Bewegungsfeldern
      - Vier aus beliebigen Feldern
      - Eine Haupt- und eine Nebensportart
    erklaerung: "Im Leistungskurs: drei Sportarten aus drei Bewegungsfeldern."
  - id: g088
    abschnitt: gyo-unterricht
    fundstelle: § 13 Abs. 3
    frage: Wie wird der Theorieteil im Leistungskurs Sport in der Q-Phase unterrichtet?
    richtig: In jedem Halbjahr zweistündig
    falsch:
      - Nur im letzten Halbjahr vierstündig
      - In jedem Halbjahr einstündig
      - Als Block am Schuljahresende
    erklaerung: Der Theorieteil ist in jedem Q-Halbjahr zweistündig.
  - id: g089
    abschnitt: gyo-unterricht
    fundstelle: § 13 Abs. 3
    frage: Wer bestimmt die Standorte für Leistungskurse Sport?
    richtig: Die jeweilige Stadtgemeinde
    falsch:
      - Die Senatorin
      - Der Landessportbund
      - Jede Schule selbst
    erklaerung: Die Standorte werden von der Stadtgemeinde bestimmt.
  - id: g090
    abschnitt: gyo-unterricht
    fundstelle: § 13 Abs. 3
    frage: Was muss für den Sport-Leistungskurs schon in der Einführungsphase belegt werden?
    richtig: Sporttheorie in den Halbjahren der E-Phase
    falsch:
      - Ein Schwimmkurs
      - Ein Sportpraktikum
      - Nichts
    erklaerung: Sporttheorie muss in den Halbjahren der Einführungsphase belegt werden.
  - id: g091
    abschnitt: gyo-unterricht
    fundstelle: § 13 Abs. 4
    frage: Wie ist ein Sportkurs gestaltet, der Grundlage einer Prüfung im 4. Prüfungsfach ist?
    richtig: Vier Wochenstunden, je zwei Theorie und Praxis, enger Theorie-Praxis-Bezug, durchgängig belegt
    falsch:
      - Zwei Stunden Praxis ohne Theorie
      - Fünf Stunden wie ein LK
      - Drei Stunden, davon eine Theorie
    erklaerung: So beschreibt § 13 Abs. 4 die Kurse für das 4. Prüfungsfach Sport.
  - id: g092
    abschnitt: gyo-unterricht
    fundstelle: § 13 Abs. 5
    frage: Welche Nachweise braucht, wer Sport als Leistungskurs wählt?
    richtig: Ärztliche Bescheinigung, mindestens Jugendschwimmabzeichen Bronze, mindestens Sportabzeichen Silber
    falsch:
      - Ärztliche Bescheinigung und Vereinsmitgliedschaft
      - Jugendschwimmabzeichen Gold und Sportabzeichen Bronze
      - Eine sportpraktische Aufnahmeprüfung
    erklaerung: Alle drei Nachweise sind vor Aufnahme des Unterrichts zu erbringen.
  - id: g093
    abschnitt: gyo-unterricht
    fundstelle: § 13 Abs. 6
    frage: Wie werden im Leistungskurs Sport und im Sportkurs für das 4. Prüfungsfach die Noten in Sportpraxis und Sporttheorie zur Halbjahresnote zusammengefasst?
    richtig: Im Verhältnis 1:1
    falsch:
      - 2:1 zugunsten der Praxis
      - 2:1 zugunsten der Theorie
      - Die schlechtere Note zählt
    erklaerung: Praxis und Theorie werden 1:1 gewichtet.
  - id: g094
    abschnitt: gyo-unterricht
    fundstelle: § 13 Abs. 6
    fall: true
    frage: "Leistungskurs Sport: Eine Schülerin erreicht in einem Halbjahr 0 Punkte in Sporttheorie und 14 Punkte in Sportpraxis. Wie hoch kann ihre Halbjahresnote höchstens sein?"
    richtig: 3 Punkte
    falsch:
      - 7 Punkte
      - 6 Punkte
      - 0 Punkte
    erklaerung: Rechnerisch wären es 7 Punkte. Bei 0 Punkten in einem der beiden Teile beträgt die Halbjahresnote aber höchstens 3 Punkte.
  - id: g095
    abschnitt: gyo-unterricht
    fundstelle: § 13 Abs. 6
    fall: true
    frage: "Leistungskurs Sport: Ein Schüler erreicht in einem Halbjahr 2 Punkte in Sporttheorie und 15 Punkte in Sportpraxis. Wie hoch kann seine Halbjahresnote höchstens sein?"
    richtig: 6 Punkte
    falsch:
      - 9 Punkte
      - 3 Punkte
      - 8 Punkte
    erklaerung: Rechnerisch wären es 8,5 Punkte. Bei 1 bis 3 Punkten in einem der beiden Teile beträgt die Halbjahresnote aber höchstens 6 Punkte.
  - id: g096
    abschnitt: gyo-unterricht
    fundstelle: § 14
    frage: Was gilt nach § 14 GyO-VO für ein Praktikum in der Oberstufe?
    richtig: Die Schule kann es anbieten; eine Fachlehrkraft betreut; Leistungen können eingebracht werden
    falsch:
      - Es ist für alle in der E-Phase Pflicht
      - Es findet in den Ferien statt und wird nicht bewertet
      - Es ersetzt die Projektarbeit
    erklaerung: Das Praktikum ist ein Angebot der Schule mit fachlicher Begleitung.
  - id: g097
    abschnitt: gyo-unterricht
    fundstelle: § 14
    frage: Wann findet ein Praktikum nach § 14 GyO-VO in der Regel statt?
    richtig: In der E-Phase, mit schulischem Konzept auch im ersten Q-Jahr
    falsch:
      - Im letzten Q-Halbjahr
      - Nach dem Abitur
      - In der Sekundarstufe I
    erklaerung: Regelmäßig in der Einführungsphase, begründet auch im ersten Jahr der Qualifikationsphase.
  - id: g098
    abschnitt: gyo-versetzung
    fundstelle: § 15 Abs. 1
    frage: Wie ist die Versetzungsentscheidung am Ende der Einführungsphase einzuordnen?
    richtig: Als pädagogische Maßnahme unter Berücksichtigung der gesamten Lernentwicklung
    falsch:
      - Als rein rechnerische Entscheidung
      - Als Ordnungsmaßnahme
      - Als Entscheidung der Schulleitung allein
    erklaerung: Die Lehrkräfte urteilen nicht nur nach ihrem Fach, sondern nach der gesamten Lernentwicklung.
  - id: g099
    abschnitt: gyo-versetzung
    fundstelle: § 15 Abs. 1
    frage: Welche Leistungen sind Grundlage der Versetzungsentscheidung?
    richtig: Die Leistungen der gesamten Einführungsphase, dazu Umstände, die die Lernentwicklung beeinflusst haben
    falsch:
      - Nur das Zeugnis des zweiten Halbjahres
      - Nur die Kernfächer
      - Die gesamte Sekundarstufe I
    erklaerung: Grundlage ist die gesamte Einführungsphase; Einflussfaktoren sind zu berücksichtigen.
  - id: g100
    abschnitt: gyo-versetzung
    fundstelle: § 15 Abs. 2
    frage: Wann wird ein Schüler in die Qualifikationsphase zugewiesen?
    richtig: Wenn zu erwarten ist, dass er dort insgesamt erfolgreich mitarbeiten kann
    falsch:
      - Nur wenn alle Fächer mindestens 5 Punkte haben
      - Automatisch nach einem Jahr
      - Nur auf Antrag der Eltern
    erklaerung: Nichtversetzung kommt nur in Frage, wenn die Lernfortschritte nicht genügen und ein Verbleib die Entwicklung beeinträchtigen würde.
  - id: g101
    abschnitt: gyo-versetzung
    fundstelle: § 16 Abs. 1
    frage: Welche Fächer sind bei der Versetzung nach § 16 GyO-VO die Kernfächer?
    richtig: Deutsch, Mathematik und erste Fremdsprache
    falsch:
      - Deutsch, Mathematik und eine Naturwissenschaft
      - Deutsch, Englisch und Geschichte
      - Alle späteren Leistungskursfächer
    erklaerung: So definiert § 16 Abs. 1 Nr. 1 die Kernfächer.
  - id: g102
    abschnitt: gyo-versetzung
    fundstelle: § 16 Abs. 1
    fall: true
    frage: "Versetzung am Ende der Einführungsphase: In welchem Fall kann die Versetzungskonferenz auf Nichtversetzung entscheiden?"
    richtig: 0 Punkte in Mathematik
    falsch:
      - 3 Punkte in Chemie, sonst überall mindestens 7 Punkte
      - Je 5 Punkte in Deutsch, Mathematik und erster Fremdsprache, sonst 8 Punkte
      - 0 Punkte in Sport, sonst überall mindestens 6 Punkte
    erklaerung: 0 Punkte in einem Kernfach reichen (Nr. 1). Ein einzelnes Fach unter 4 oder ein übriges Fach mit 0 Punkten genügt nicht; 15 Kernfachpunkte sind nicht „weniger als 15“.
  - id: g103
    abschnitt: gyo-versetzung
    fundstelle: § 16 Abs. 1 Nr. 3
    fall: true
    frage: "Zeugnis am Ende der Einführungsphase: Deutsch 5, Mathematik 5, erste Fremdsprache 4 Punkte, alle übrigen Fächer mindestens 8 Punkte. Kann auf Nichtversetzung entschieden werden?"
    richtig: Ja, die Kernfächer ergeben zusammen weniger als 15 Punkte
    falsch:
      - Nein, kein Kernfach liegt unter 4 Punkten
      - Ja, weil ein Kernfach unter 5 Punkten liegt
      - Nein, die anderen Fächer gleichen aus
    erklaerung: Die Kernfächer ergeben zusammen 5 + 5 + 4 = 14 Punkte, also weniger als 15 (§ 16 Abs. 1 Nr. 3).
  - id: g104
    abschnitt: gyo-versetzung
    fundstelle: § 16 Abs. 1 Nr. 2
    fall: true
    frage: "Zeugnis am Ende der Einführungsphase: Deutsch 3 und Mathematik 3 Punkte, alle übrigen Fächer einschließlich der ersten Fremdsprache 10 Punkte. Kann auf Nichtversetzung entschieden werden?"
    richtig: Ja, zwei Kernfächer liegen jeweils unter 4 Punkten
    falsch:
      - Nein, beide werden ausgeglichen
      - Nein, dafür braucht es 0 Punkte
      - Nur mit Zustimmung der Eltern
    erklaerung: Zwei Kernfächer mit jeweils weniger als 4 Punkten erfüllen § 16 Abs. 1 Nr. 2. Ein Ausgleich spielt dafür keine Rolle.
  - id: g105
    abschnitt: gyo-versetzung
    fundstelle: § 16 Abs. 2
    frage: "Versetzungsentscheidung am Ende der Einführungsphase: Wann gilt ein Fach mit weniger als 4 Punkten als ausgeglichen?"
    richtig: Wenn es zusammen mit einem weiteren Fach 10 Punkte ergibt
    falsch:
      - Wenn ein anderes Fach mindestens 10 Punkte hat
      - Wenn der Gesamtdurchschnitt mindestens 5 Punkte beträgt
      - Wenn die Klassenkonferenz es beschließt
    erklaerung: "Ausgleich: Punktsumme aus diesem und einem weiteren Fach beträgt 10 Punkte."
  - id: g106
    abschnitt: gyo-versetzung
    fundstelle: § 16 Abs. 1 Nr. 6
    fall: true
    frage: "Zeugnis am Ende der Einführungsphase: Biologie 3 und Geographie 3 Punkte, alle anderen Fächer einschließlich der Kernfächer je 6 Punkte. Kann auf Nichtversetzung entschieden werden?"
    richtig: Ja, für keines der beiden Fächer ist ein Ausgleich möglich
    falsch:
      - Nein, kein Kernfach ist betroffen
      - Nein, zwei Fächer unter 4 Punkten sind immer zulässig
      - Ja, aber nur wegen Geographie
    erklaerung: Ein Ausgleich verlangt zusammen mit einem weiteren Fach 10 Punkte. Hier kommt jedes Paar höchstens auf 3 + 6 = 9 Punkte, also fehlt der Ausgleich für beide Fächer (§ 16 Abs. 1 Nr. 6).
  - id: g107
    abschnitt: gyo-versetzung
    fundstelle: § 16 Abs. 1 Nr. 6
    fall: true
    frage: "Zeugnis am Ende der Einführungsphase: Geschichte 3 und Chemie 3 Punkte, Kunst 7 und Physik 7 Punkte, alle übrigen Fächer einschließlich der Kernfächer je 6 Punkte. Kann auf Nichtversetzung entschieden werden?"
    richtig: Nein, beide Fächer sind ausgeglichen (3 + 7 = 10)
    falsch:
      - Ja, zwei Fächer unter 4 Punkten reichen immer
      - Ja, die Kernfächer haben zusammen weniger als 20 Punkte
      - Ja, weil Geschichte Pflichtfach der Einführungsphase ist
    erklaerung: Jedes der beiden schwachen Fächer wird durch ein eigenes Fach mit 7 Punkten ausgeglichen. Die Kernfächer haben zusammen 18 Punkte, also nicht weniger als 15.
  - id: g108
    abschnitt: gyo-versetzung
    fundstelle: § 16 Abs. 1 Nr. 4
    frage: "Zeugnis am Ende der Einführungsphase: Ein Fach, das kein Kernfach ist, hat 0 Punkte. Alle anderen Fächer haben mindestens 7 Punkte. Kann allein deshalb auf Nichtversetzung entschieden werden?"
    richtig: Nein, erst bei 0 Punkten in mehr als einem der übrigen Fächer
    falsch:
      - Ja, 0 Punkte reichen immer
      - Ja, wenn es ein Profilfach ist
      - Nur im zweiten Halbjahr
    erklaerung: Nr. 4 verlangt 0 Punkte in mehr als einem der übrigen Fächer.
  - id: g109
    abschnitt: gyo-versetzung
    fundstelle: § 16 Abs. 1 Nr. 5
    frage: "Versetzung am Ende der Einführungsphase: Ab wie vielen Fächern mit jeweils weniger als 4 Punkten kann ohne Rücksicht auf einen Ausgleich auf Nichtversetzung entschieden werden?"
    richtig: Ab drei Fächern (mehr als zwei)
    falsch:
      - Ab zwei Fächern
      - Ab vier Fächern
      - Ab einem Fach
    erklaerung: "Nr. 5: in mehr als zwei Fächern jeweils weniger als 4 Punkte."
  - id: g110
    abschnitt: gyo-versetzung
    fundstelle: § 16 Abs. 3
    frage: Wie wird der Vermerk „nicht beurteilbar“ bei der Versetzungsentscheidung am Ende der Einführungsphase behandelt?
    richtig: Wie 2 Punkte
    falsch:
      - Wie 0 Punkte
      - Wie 4 Punkte
      - Das Fach bleibt unberücksichtigt
    erklaerung: Der Vermerk wird wie 2 Punkte behandelt.
  - id: g111
    abschnitt: gyo-versetzung
    fundstelle: § 17 Abs. 1
    frage: Wann berät die Klassenkonferenz die Lernentwicklung der Einführungsphase?
    richtig: Vor den Osterferien
    falsch:
      - Vor den Herbstferien
      - Zum Halbjahreszeugnis
      - Nach den Sommerferien
    erklaerung: Die Beratung findet vor den Osterferien statt.
  - id: g112
    abschnitt: gyo-versetzung
    fundstelle: § 17 Abs. 2
    frage: Was geschieht, wenn die Versetzung wegen mangelhafter oder ungenügender Leistungen gefährdet ist?
    richtig: Die Fachlehrkraft begründet schriftlich nach Teilbereichen; Schüler und Eltern werden schriftlich informiert
    falsch:
      - Ein Elterngespräch genügt
      - Sofortige Nachprüfung
      - Die Konferenz beschließt Förderunterricht
    erklaerung: Schriftliche Begründung mit Bezug auf die Teilbereiche des Bildungsplans und schriftliche Information.
  - id: g113
    abschnitt: gyo-versetzung
    fundstelle: § 18 Abs. 1
    frage: Wer bildet die Versetzungskonferenz?
    richtig: Die Lehrkräfte, die die Schülerin oder den Schüler unterrichten
    falsch:
      - Die Prüfungskommission
      - Schulleitung und Klassenleitung
      - Alle Lehrkräfte der Schule
    erklaerung: Die unterrichtenden Lehrkräfte entscheiden als Versetzungskonferenz.
  - id: g114
    abschnitt: gyo-versetzung
    fundstelle: § 18 Abs. 1
    frage: Wie lautet die Entscheidung der Versetzungskonferenz?
    richtig: „versetzt“ oder „nicht versetzt“
    falsch:
      - „versetzt“, „vorläufig versetzt“ oder „nicht versetzt“
      - Eine Punktzahl
      - „bestanden“ oder „nicht bestanden“
    erklaerung: Es gibt nur diese beiden Entscheidungen.
  - id: g115
    abschnitt: gyo-versetzung
    fundstelle: § 18 Abs. 2
    frage: Welche Abstimmungsregeln gelten in der Versetzungskonferenz?
    richtig: Einfache Mehrheit, bei Gleichheit entscheidet der Vorsitz, keine Enthaltung
    falsch:
      - Zwei-Drittel-Mehrheit, Enthaltung erlaubt
      - Einstimmigkeit
      - Einfache Mehrheit, bei Gleichheit gilt „versetzt“
    erklaerung: "Vorsitz: Schulleitung oder beauftragte Lehrkraft; Stimmenthaltung ist nicht zulässig."
  - id: g116
    abschnitt: gyo-versetzung
    fundstelle: § 18 Abs. 3
    frage: Wer darf mit beratender Stimme an der Versetzungskonferenz teilnehmen?
    richtig: Klassenelternsprecher sowie Klassenschülersprecher oder zwei Jahrgangsschülersprecher
    falsch:
      - Alle Eltern der Klasse
      - Die betroffene Schülerin selbst
      - Ein Mitglied des Zentralelternbeirats
    erklaerung: Der Vorsitz kann sie zum Schutz der Persönlichkeit von der Beratung ausschließen.
  - id: g117
    abschnitt: gyo-versetzung
    fundstelle: § 18 Abs. 3
    frage: Wann ist eine Klassenelternsprecherin von der Beratung der Versetzungskonferenz ausgeschlossen?
    richtig: Wenn über ihr eigenes Kind beraten wird
    falsch:
      - Bei jeder Nichtversetzung
      - Wenn sie zu spät eingeladen wurde
      - Nie
    erklaerung: Ebenso ist ein Schülersprecher ausgeschlossen, soweit über ihn selbst beraten wird.
  - id: g118
    abschnitt: gyo-versetzung
    fundstelle: § 18 Abs. 4
    frage: Eine Lehrkraft kann aus zwingenden Gründen nicht an der Versetzungskonferenz teilnehmen. Was muss sie tun?
    richtig: Sie leitet ihre Beurteilung mit Erläuterungen rechtzeitig dem Vorsitz oder der Klassenleitung zu
    falsch:
      - Die Konferenz wird verschoben
      - Ihre Note bleibt unberücksichtigt
      - Eine Vertretung stimmt für sie
    erklaerung: Kommt keine Beurteilung, berücksichtigt die Konferenz die zugänglichen Unterlagen.
  - id: g119
    abschnitt: gyo-versetzung
    fundstelle: § 18 Abs. 5
    frage: Wie ist die Versetzungskonferenz besetzt, wenn nach dem Notenbild nur eine Versetzung in Frage kommt?
    richtig: Schulleitung oder beauftragte Lehrkraft als Vorsitz und Klassenlehrkraft
    falsch:
      - Alle unterrichtenden Lehrkräfte
      - Nur die Klassenlehrkraft
      - Die Prüfungskommission
    erklaerung: Für eindeutige Fälle genügt diese verkleinerte Besetzung.
  - id: g120
    abschnitt: gyo-versetzung
    fundstelle: § 18 Abs. 6
    frage: Was geschieht nach der Entscheidung „nicht versetzt“?
    richtig: Zeugnis unverzüglich ausstellen; schriftliche Mitteilung an Eltern bzw. die volljährige Person
    falsch:
      - Nur mündliche Mitteilung
      - Automatische Nachprüfung
      - Mitteilung zum neuen Schuljahr
    erklaerung: Die Entscheidung wird schriftlich mitgeteilt, bei Volljährigen ihnen selbst.
  - id: g121
    abschnitt: gyo-abschluesse
    fundstelle: § 19
    frage: Wer legt am Ende der Einführungsphase eine Prüfung zum Mittleren Schulabschluss ab?
    richtig: Wer bei Eintritt noch keinen Mittleren Schulabschluss hatte und dessen Versetzung gefährdet ist
    falsch:
      - Alle Schülerinnen und Schüler der E-Phase
      - Nur Schüler aus Vorbereitungsklassen
      - Wer freiwillig einen weiteren Abschluss möchte
    erklaerung: "Voraussetzung: kein Mittleren Schulabschluss bei Eintritt und Versetzungsgefährdung nach § 17."
  - id: g122
    abschnitt: gyo-abschluesse
    fundstelle: § 20 Abs. 1
    frage: Woraus besteht die Fachhochschulreife?
    richtig: Aus einem schulischen und einem berufsbezogenen Teil
    falsch:
      - Nur aus dem schulischen Teil
